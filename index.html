    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; color: #1c1c1e; background: #fff;
  }
  @media (prefers-color-scheme: dark) { body { color: #e5e5e7; background: #000; } a { color: #0a84ff; } }

</style>
